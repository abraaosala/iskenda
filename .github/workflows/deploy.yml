# ─────────────────────────────────────────────────────────────
#  Deploy do Iskenda (Vite SPA) para o Hostinger via SSH
#
#  O deploy é feito por rsync sobre SSH (porta personalizada via
#  secret SSH_PORT) com swap atómico: upload para .dist-staging
#  e depois rsync local no servidor para dist/, evitando o
#  dangerous-clean-slate do FTP que deixava o site instável.
#
#  Qualidade (lint/format/test/audit) fica no workflow CI — aqui
#  só build, verificação do artifact e deploy.
#
#  Pré-requisitos (uma vez) — Settings → Secrets and variables → Actions:
#    Secrets:
#      SSH_HOST   → servidor SSH (ex: 31.220.106.101)
#      SSH_USER   → utilizador SSH
#      SSH_KEY    → chave privada SSH
#      SSH_PORT   → porta SSH personalizada
#    Variables:
#      PROD_PATH  → diretório web remoto (relativo ou absoluto)
#                   ex: u634834160/domains/iskenda.ao/public_html/
#      PROD_DIR   → diretório raiz do build (ex: dist)
#      PROD_URL   → URL do health check (ex: https://iskenda.ao/)
#      STAGING_URL  → reservado para futura staging
#      STAGING_PATH → reservado para futura staging
# ─────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Verificar dist e .htaccess
        run: |
          test -f dist/index.html
          test -f dist/.htaccess || { echo "dist/.htaccess em falta"; exit 1; }
          test -f dist/$(node -e "const m=require('fs').readdirSync('dist/assets').filter(f=>f.endsWith('.js'));process.stdout.write('assets/'+m[0])")

      - name: Guardar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: ./dist/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy via SSH (rsync atómico)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          PROD_PATH: ${{ vars.PROD_PATH }}
          PROD_DIR: ${{ vars.PROD_DIR }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?secret SSH_HOST em falta}"
          : "${SSH_USER:?secret SSH_USER em falta}"
          : "${SSH_KEY:?secret SSH_KEY em falta}"
          : "${SSH_PORT:?secret SSH_PORT em falta}"
          : "${PROD_PATH:?variable PROD_PATH em falta}"
          : "${PROD_DIR:?variable PROD_DIR em falta}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          REMOTE="$SSH_USER@$SSH_HOST"

          # PROD_PATH pode ser relativo (u634834160/domains/...) ou absoluto (/home/...)
          case "$PROD_PATH" in
            /*) REMOTE_ROOT="$PROD_PATH" ;;
            *)  REMOTE_ROOT="/home/$PROD_PATH" ;;
          esac
          REMOTE_ROOT="${REMOTE_ROOT%/}/"
          PROD_DIR="${PROD_DIR#/}"; PROD_DIR="${PROD_DIR%/}"

          rsync -a --delete -e "ssh $SSH_OPTS" ./dist/ "$REMOTE:${REMOTE_ROOT}.dist-staging/"
          ssh $SSH_OPTS "$REMOTE" "cd \"${REMOTE_ROOT}\" && rsync -a --delete .dist-staging/ \"${PROD_DIR}/\" && rm -rf .dist-staging"

      - name: Health check pós-deploy
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          : "${PROD_URL:?variable PROD_URL em falta}"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "$PROD_URL")
            echo "Tentativa $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site OK (HTTP $code)"
              exit 0
            fi
            sleep 10
          done
          echo "Health check falhou: HTTP $code (6 tentativas)"
          exit 1