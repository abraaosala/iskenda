# ─────────────────────────────────────────────────────────────
#  Deploy do Iskenda (Vite SPA) para o Hostinger via SSH
#
#  O deploy é feito por SCP + rsync sobre SSH (porta personalizada
#  configurada no secret SSH_PORT), evitando o dangerous-clean-slate
#  do FTP que deixava o site instável durante o upload.
#
#  Pré-requisitos (uma vez):
#    1. Configurar os secrets no GitHub
#       (Settings → Secrets and variables → Actions):
#         SSH_HOST  → servidor SSH (ex: 31.220.106.101)
#         SSH_USER  → utilizador SSH
#         SSH_KEY   → chave privada SSH
#         SSH_PORT  → porta SSH personalizada
# ─────────────────────────────────────────────────────────────
name: Deploy (CI/CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Verificar dist e .htaccess
        run: |
          test -f dist/index.html
          test -f dist/.htaccess || { echo "dist/.htaccess em falta"; exit 1; }
          test -f dist/$(node -e "const m=require('fs').readdirSync('dist/assets').filter(f=>f.endsWith('.js'));process.stdout.write('assets/'+m[0])")

      - name: Guardar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: ./dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build para o servidor (staging)
        id: scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: /home/u634834160/domains/iskenda.ao/public_html/.dist-staging
          strip_components: 1

      - name: Sincronizar dist com rsync (atomico)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd /home/u634834160/domains/iskenda.ao/public_html
            rsync -a --delete .dist-staging/ dist/
            rm -rf .dist-staging

      - name: Health check pós-deploy
        id: healthcheck
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 https://iskenda.ao/)
            echo "Tentativa $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site OK (HTTP $code)"
              exit 0
            fi
            sleep 10
          done
          echo "Health check falhou: HTTP $code (5 tentativas)"
          exit 1
        env:
          APP_URL: https://www.iskenda.ao
